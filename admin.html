<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shop.css"></head><body>
<header><div class="wrap nav"><a class="logo" href="index.html"><span>G</span> لوحة التحكم</a><a class="pill" href="index.html">الموقع</a></div></header>
<main class="wrap" style="padding:24px 18px">
<div id="login" class="card" style="max-width:380px;margin:auto" hidden><h3>دخول الأدمن</h3><label>الإيميل</label><input id="e" type="email" style="width:100%"><label>كلمة السر</label><input id="p" type="password" style="width:100%"><button id="go" class="btn block">دخول</button><p class="err" id="err"></p></div>
<div id="panel" hidden>
<h2>المنتجات</h2>
<div class="card" style="text-align:right"><h3>إضافة منتج</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><input id="nn" placeholder="الاسم"><input id="np" type="number" placeholder="السعر" min="0"><input id="nc" placeholder="القسم"><input id="nd" placeholder="وصف (اختياري)"><input id="nf" type="file" accept="image/*"></div><button id="add" class="btn sm">إضافة</button></div>
<div style="overflow:auto;margin-top:14px"><table class="tbl" id="pt"></table></div>
<h2 style="margin-top:30px">الطلبات</h2><div style="overflow:auto"><table class="tbl" id="ot"></table></div>
</div><p id="deny" class="err" hidden>الحساب ده مش أدمن.</p></main>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
